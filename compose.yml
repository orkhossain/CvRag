
services:
  cvrag:
    build: .
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      API_TOKEN: ${API_TOKEN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
    develop:
      watch:
        - action: sync+restart
          path: ./cvrag
          target: /app/cvrag
        - action: sync+restart
          path: ./app.py
          target: /app/app.py
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./Dockerfile
    volumes:
      - ./cv.pdf:/app/cv.pdf
