[project]
name = "cvrag"
version = "3.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "langchain",
    "langchain-community",
    "langgraph",
    "langchain-text-splitters",
    "faiss-cpu",
    "sentence-transformers",
    "langchain-groq",
    "langchain-ollama",
    "langchain-huggingface",
    "pydantic",
    "pdfminer.six",
    "python-dateutil",
    "torch",
    "langdetect",
    "celery",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cvrag"]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
